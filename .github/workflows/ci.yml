name: Lean 4, Python Chebyshev-Hashimoto Certificate, & Rust Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lean4-verification:
    name: Lean 4 Formal Proof & Axiom Audit (v4.33.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install elan and Lean 4
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v4.1.1/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Cache Lean packages (Mathlib, formal-conjectures)
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      - name: Fetch prebuilt Mathlib oleans
        run: lake exe cache get
      - name: Build Lean 4 proofs and formal-conjectures statement with --wfail
        run: lake --wfail build
      - name: Run Kernel Axiom Audit (#print axioms)
        run: lake env lean Erdos64/AxiomCheck.lean
      - name: Compile ancillary arXiv Lean file
        run: lake env lean paper/anc/64.lean

  python-verification:
    name: Python 3 Chebyshev-Hashimoto & Extremal Graph Certificate Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NumPy, SciPy, & SymPy
        run: pip install numpy scipy sympy
      - name: Verify Chebyshev-Hashimoto Discharging Closure Certificates
        run: python3 paper/anc/verify_erdos64_chebyshev_hashimoto_closure.py
      - name: Verify Full Theorems 2.1-2.16 Hierarchy
        run: python3 scripts/verify_erdos64_theorems.py

  rust-suite:
    name: Rust Hashimoto Spectral & Half-Length Bitmask DP Suite (CPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Unit & Theorem Certificate Tests
        run: cargo test --release
