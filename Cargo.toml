[package]
name = "erdos64"
version = "0.2.0"
edition = "2021"
authors = ["Lucas Parobek <parobek@gmail.com>"]
description = "GPU-accelerated certification and Chebyshev-Hashimoto spectral-topological discharging closure for Erdős Problem #64 ($1,000 Falsifiable Prize — the Erdős–Gyárfás 2^k-Cycle Conjecture)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/doublegate/erdos64"
homepage = "https://github.com/doublegate/erdos64"
readme = "README.md"
keywords = ["erdos", "erdos-gyarfas", "dyadic-cycles", "cubic-graphs", "cuda"]
categories = ["mathematics", "algorithms", "science"]

[dependencies]
cudarc = { version = "0.19", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "dynamic-loading",
    "cuda-13030",
] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
